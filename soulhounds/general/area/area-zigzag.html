<main>
    <h2>一般指針</h2>
    <h3>エリア・ジグザグ</h3>

    <div class="stage-fig" style="width: 50%; display: flex; gap: 1em; align-items: flex-start;">
        <div>
            <div>
                <img src="../../png/area-zigzag-ui.png" alt="エリア・ジグザグ">

            </div>
        </div>

                <figcaption>図 3.2.12.2. ジグザグの経路</figcaption>
            </div>
        </div>
    </div>



    <h4>指針</h4>
    <p>
        ジグザグは，自然に潜行します．
    </p>


    <h4>解説</h4>
    <p>
        <b>ジグザグ</b>とは，図 3.2.12.1 のエリアを指します． 1000 m型 44 行目に確率で出現します． P-1 行目の針と塊の配列によって同定されます．図 3.1.12.2 の経路が定型です．
    </p>
    <p>
        0 列進入時において動作が滞った場合は，潜行の継続が針猶予に間に合わない恐れがあるため， &pm;1 列に向かって経路を即座に 1 マス引き返すことも有効です．
    </p>
